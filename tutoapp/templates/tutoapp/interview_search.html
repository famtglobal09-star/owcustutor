{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ seo_title }}</title>{% include "tutoapp/seo_head.html" %}<link rel="stylesheet" href="{% static 'tutoapp/site-nav.css' %}"><link rel="stylesheet" href="{% static 'tutoapp/interview.css' %}"></head><body class="interview-site"><header class="interview-header"><a class="brand interview-brand" href="/"><img class="brand-logo" src="{% static 'tutoapp/images/owcus-logo.webp' %}" alt="OWCUS"></a>{% include "tutoapp/site_nav_clean.html" %}</header><main class="interview-container"><div class="eyebrow">Search the question bank</div><h1>Find interview questions that match your next round.</h1><form class="search-toolbar" method="get"><input name="q" value="{{ query }}" placeholder="Search questions or keywords" aria-label="Search"><select name="difficulty"><option value="">All difficulties</option><option {% if difficulty == 'Beginner' %}selected{% endif %}>Beginner</option><option {% if difficulty == 'Intermediate' %}selected{% endif %}>Intermediate</option><option {% if difficulty == 'Advanced' %}selected{% endif %}>Advanced</option></select><select name="audience"><option value="">All candidates</option><option {% if audience == 'Fresher' %}selected{% endif %}>Fresher</option><option {% if audience == 'Experienced' %}selected{% endif %}>Experienced</option><button class="button" type="submit">Search</button></form><div class="question-grid">{% for question in questions %}<a class="question-card" href="{% url 'interview_question' question.slug %}"><span class="meta">{{ question.difficulty }} · {{ question.audience }}</span><h3>{{ question.title }}</h3><p>{{ question.answer|truncatewords:28 }}</p><span class="read">Read the answer →</span></a>{% empty %}<div class="empty"><h2>No matching questions yet</h2><p class="muted">Try a broader keyword such as testing, SQL, Python or Selenium.</p></div>{% endfor %}</div></main>{% include "tutoapp/site_footer.html" %}<script src="{% static 'tutoapp/site-nav.js' %}"></script></body></html>
