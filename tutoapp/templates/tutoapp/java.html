function keyFor(cat,sub){return 'j'+C.findIndex(x=>x[0]===cat)+'-'+C[ C.findIndex(x=>x[0]===cat) ][1].indexOf(sub)}
function codeFor(cat,sub){let c='public class Main {\n  public static void main(String[] args) {\n    System.out.println("'+sub.replace(/"/g,'\\"')+' in '+cat.replace(/"/g,'\\"')+'");\n    int value = 7;\n    System.out.println(value * 2);\n  }\n}';if(/String/i.test(sub))c='public class Main {\n  public static void main(String[] args) {\n    String text = "OWCUS Java";\n    System.out.println(text);\n    System.out.println(text.length());\n  }\n}';if(/Loop|Traversal|Iteration/i.test(sub))c='public class Main {\n  public static void main(String[] args) {\n    for (int i = 1; i <= 3; i++) {\n      System.out.println("Step " + i);\n    }\n  }\n}';if(/Method|Lambda|Function/i.test(sub))c='public class Main {\n  static int add(int a, int b) { return a + b; }\n  public static void main(String[] args) {\n    System.out.println(add(2, 3));\n  }\n}';if(/Class|Object|Encapsulation|Inheritance|Polymorphism|Interface|Constructor/i.test(cat+sub))c='public class Main {\n  static class Course {\n    private final String name;\n    Course(String name) { this.name = name; }\n    String title() { return name; }\n  }\n  public static void main(String[] args) {\n    Course course = new Course("Java");\n    System.out.println(course.title());\n  }\n}';return c}
function guide(cat,sub){const d=topicData[cat]||['This lesson introduces '+sub+' and shows how it is used in Java programs.','Read the syntax, run the examples, then change one value at a time.'];let steps;if(/Variable|Data Type|String|Array/.test(cat))steps=['Identify the data or declaration','Apply the Java rule shown in the example','Use the value in an expression or object','Check the result and type'];else if(/Condition|Loop|Control Flow/.test(cat))steps=['Evaluate the condition or current state','Choose the next block to execute','Update state so the program can progress','Stop or continue and inspect the output'];else if(/Method|Constructor|Class|Object|Interface|Encapsulation|Inheritance|Polymorphism|Abstraction/.test(cat))steps=['Define the type or contract','Create or receive the required values','Call the behaviour through its API','Observe the returned value or changed state'];else if(/Exception|File|JDBC|Networking/.test(cat))steps=['Open or prepare the resource','Perform the operation inside the safe boundary','Handle success and failure paths','Release resources and report the result'];else steps=['Prepare the input and required Java types','Apply the feature using its syntax','Compile and execute the program','Inspect the output and improve the design'];return '<section class="info-grid"><div class="info"><h3>Why it matters</h3><p>'+esc(d[0])+'</p></div><div class="info"><h3>Core idea</h3><p>'+esc(d[1])+'</p></div></section><h2>Step-by-step explanation</h2><ol>'+steps.map((s,i)=>'<li><b>'+esc(s)+'.</b> '+esc(['Read the lesson title and locate that part in the example.','Use the syntax exactly, including types, braces and semicolons.','Change only one input at a time so the effect is easy to understand.','Compare the actual output with the expected result.'][i])+'</li>').join('')+'</ol>'}

/td><td>Keep each class or method focused.</td><td>Putting all logic in main.</td></tr></table><div class="mistakes"><b>Common mistakes:</b><ul><li>Compile the exact class name used in the file.</li><li>Read compiler errors from the first reported line.</li><li>Test a normal case, an edge case and invalid input.</li></ul></div><h2>Practice exercises</h2><ol><li><b>Beginner:</b> change the values and explain the output.</li><li><b>Intermediate:</b> add validation and one additional example.</li><li><b>Advanced:</b> refactor the example into reusable classes or methods.</li></ol><h2>Interview questions</h2><ol><li>What problem does '+esc(sub)+' solve?</li><li>Which Java rule or keyword is most important here?</li><li>Write a small program that demonstrates the edge case.</li></ol><div class="summary"><b>Summary:</b> Understand the rule, write the smallest complete program, compile it, inspect the output, then practise a variation.</div><div class="pager"><a href="#'+prev+'">« Previous</a><a href="#'+next+'">Next »</a></div></article>'}

<script>
// Topic-aware Java examples. Every lesson keeps the same layout, but the code
// and expected output now demonstrate the selected concept.
function javaProgram(body){const imports=(body.match(/^\s*import [^;]+;\s*/gm)||[]).join('');body=body.replace(/^\s*import [^;]+;\s*/gm,'');return imports+'public class Main {\n'+body+'\n}'}
function codeFor(cat,sub){
  const k=(cat+' '+sub).toLowerCase();
  if(/variable|assigning|scope/.test(k)) return javaProgram('  public static void main(String[] args) {\n    int score = 70;\n    score += 15;\n    String level = score >= 80 ? "pass" : "retry";\n    System.out.println(score);\n    System.out.println(level);\n  }');
  if(/data type|casting|wrapper|autobox/.test(k)) return javaProgram('  public static void main(String[] args) {\n    int whole = 9;\n    double decimal = whole;\n    int converted = (int) 4.8;\n    System.out.println(decimal);\n    System.out.println(converted);\n  }');
  if(/operator/.test(k)) return javaProgram('  public static void main(String[] args) {\n    int a = 10, b = 3;\n    System.out.println(a + b);\n    System.out.println(a % b);\n    System.out.println(a > b && b > 0);\n  }');
  if(/conditional|if statement|switch/.test(k)) return javaProgram('  public static void main(String[] args) {\n    int marks = 76;\n    if (marks >= 90) System.out.println("A");\n    else if (marks >= 60) System.out.println("B");\n    else System.out.println("C");\n  }');
  if(/loop|nested loop|iteration/.test(k)) return javaProgram('  public static void main(String[] args) {\n    for (int day = 1; day <= 3; day++) {\n      System.out.println("Day " + day);\n    }\n  }');
  if(/control flow|break|continue|return|branch/.test(k)) return javaProgram('  public static void main(String[] args) {\n    for (int n = 1; n <= 5; n++) {\n      if (n == 3) continue;\n      if (n == 5) break;\n      System.out.println(n);\n    }\n  }');
  if(/array|arrays utility/.test(k)) return javaProgram('  public static void main(String[] args) {\n    int[] prices = {12, 18, 25};\n    int total = 0;\n    for (int price : prices) total += price;\n    System.out.println("Items: " + prices.length);\n    System.out.println("Total: " + total);\n  }');
  if(/string|stringbuilder|stringbuffer/.test(k)) return javaProgram('  public static void main(String[] args) {\n    String text = "Java learning";\n    StringBuilder result = new StringBuilder(text);\n    result.append(" is practical");\n    System.out.println(result);\n    System.out.println(result.length());\n  }');
  if(/method|varargs/.test(k)) return javaProgram('  static int add(int first, int second) {\n    return first + second;\n  }\n\n  public static void main(String[] args) {\n    System.out.println(add(8, 4));\n  }');
  if(/constructor|class|object|encapsulation/.test(k)) return javaProgram('  static class Account {\n    private final String owner;\n    Account(String owner) { this.owner = owner; }\n    String getOwner() { return owner; }\n  }\n\n  public static void main(String[] args) {\n    Account account = new Account("Asha");\n    System.out.println(account.getOwner());\n  }');
  if(/inheritance/.test(k)) return javaProgram('  static class Animal {\n    void speak() { System.out.println("animal sound"); }\n  }\n  static class Dog extends Animal {\n    @Override void speak() { System.out.println("bark"); }\n  }\n\n  public static void main(String[] args) {\n    Animal pet = new Dog();\n    pet.speak();\n  }');
  if(/polymorphism/.test(k)) return javaProgram('  interface Payment { void pay(); }\n  static class CardPayment implements Payment {\n    public void pay() { System.out.println("card payment"); }\n  }\n\n  public static void main(String[] args) {\n    Payment payment = new CardPayment();\n    payment.pay();\n  }');
  if(/abstraction/.test(k)) return javaProgram('  abstract static class Report {\n    abstract String title();\n    void print() { System.out.println(title()); }\n  }\n  static class SalesReport extends Report {\n    String title() { return "Sales report"; }\n  }\n\n  public static void main(String[] args) {\n    new SalesReport().print();\n  }');
  if(/interface|functional interface/.test(k)) return javaProgram('  interface Greeting { String message(String name); }\n\n  public static void main(String[] args) {\n    Greeting greeting = name -> "Hello, " + name;\n    System.out.println(greeting.message("Java"));\n  }');
  if(/exception/.test(k)) return javaProgram('  public static void main(String[] args) {\n    try {\n      int value = Integer.parseInt("not-a-number");\n      System.out.println(value);\n    } catch (NumberFormatException error) {\n      System.out.println("Invalid number handled");\n    }\n  }');
  if(/file handling/.test(k)) return javaProgram('  public static void main(String[] args) {\n    String fileName = "report.txt";\n    System.out.println("Ready to read: " + fileName);\n    System.out.println("Use try-with-resources for the stream");\n  }');
  if(/date|time/.test(k)) return javaProgram('  import java.time.LocalDate;\n\n  public static void main(String[] args) {\n    LocalDate date = LocalDate.of(2026, 1, 15);\n    System.out.println(date.getYear());\n    System.out.println(date.plusDays(1));\n  }');
  if(/math/.test(k)) return javaProgram('  public static void main(String[] args) {\n    double radius = 3;\n    double area = Math.PI * radius * radius;\n    System.out.printf("%.2f%n", area);\n  }');
  if(/regular expression|regex/.test(k)) return javaProgram('  public static void main(String[] args) {\n    String email = "learner@example.com";\n    System.out.println(email.matches(".+@.+\\\\..+"));\n  }');
  if(/collection|list|set|map/.test(k)) return javaProgram('  import java.util.ArrayList;\n  import java.util.List;\n\n  public static void main(String[] args) {\n    List<String> tools = new ArrayList<>();\n    tools.add("javac"); tools.add("java");\n    System.out.println(tools);\n    System.out.println(tools.size());\n  }');
  if(/generic/.test(k)) return javaProgram('  static <T> T first(T[] values) { return values[0]; }\n\n  public static void main(String[] args) {\n    Integer[] values = {10, 20};\n    System.out.println(first(values));\n  }');
  if(/lambda/.test(k)) return javaProgram('  import java.util.function.IntUnaryOperator;\n\n  public static void main(String[] args) {\n    IntUnaryOperator doubleIt = value -> value * 2;\n    System.out.println(doubleIt.applyAsInt(6));\n  }');
  if(/stream/.test(k)) return javaProgram('  import java.util.List;\n\n  public static void main(String[] args) {\n    List<Integer> values = List.of(2, 5, 8);\n    values.stream().filter(value -> value > 4).forEach(System.out::println);\n  }');
  if(/thread/.test(k)) return javaProgram('  public static void main(String[] args) throws InterruptedException {\n    Thread worker = new Thread(() -> System.out.println("Worker finished"));\n    worker.start();\n    worker.join();\n  }');
  if(/jdbc/.test(k)) return javaProgram('  public static void main(String[] args) {\n    String query = "SELECT name FROM students WHERE id = ?";\n    System.out.println("Prepared query: " + query);\n  }');
  if(/network/.test(k)) return javaProgram('  import java.net.URI;\n\n  public static void main(String[] args) {\n    URI endpoint = URI.create("https://owcus.example/lessons");\n    System.out.println(endpoint.getHost());\n  }');
  if(/annotation|reflection/.test(k)) return javaProgram('  @Deprecated\n  static void oldApi() { }\n\n  public static void main(String[] args) throws Exception {\n    System.out.println(Main.class.getDeclaredMethod("oldApi").getName());\n  }');
  if(/static/.test(k)) return javaProgram('  static int learners = 0;\n\n  public static void main(String[] args) {\n    learners++;\n    System.out.println("Learners: " + learners);\n  }');
  if(/final|constant/.test(k)) return javaProgram('  public static void main(String[] args) {\n    final double TAX_RATE = 0.18;\n    double price = 100;\n    System.out.println(price * (1 + TAX_RATE));\n  }');
  return javaProgram('  public static void main(String[] args) {\n    System.out.println("Java program: " + "'+sub.replace(/"/g,'\\"')+'");\n    System.out.println("Compiled and executed successfully");\n  }');
}
function javaOutput(cat,sub){
  const k=(cat+' '+sub).toLowerCase();
  if(/variable|assigning|scope/.test(k)) return '85\npass';
  if(/data type|casting|wrapper|autobox/.test(k)) return '9.0\n4';
  if(/operator/.test(k)) return '13\n1\ntrue';
  if(/conditional|if statement|switch/.test(k)) return 'B';
  if(/loop|iteration/.test(k)) return 'Day 1\nDay 2\nDay 3';
  if(/control flow|break|continue|return|branch/.test(k)) return '1\n2\n4';
  if(/array/.test(k)) return 'Items: 3\nTotal: 55';
  if(/string/.test(k)) return 'Java learning is practical\n27';
  if(/method/.test(k)) return '12';
  if(/inheritance/.test(k)) return 'bark';
  if(/exception/.test(k)) return 'Invalid number handled';
  if(/stream/.test(k)) return '5\n8';
  if(/lambda/.test(k)) return '12';
  if(/math/.test(k)) return '28.27';
  if(/date|time/.test(k)) return '2026\n2026-01-16';
  if(/collection/.test(k)) return '[javac, java]\n2';
  if(/generic/.test(k)) return '10';
  return 'Topic example completed successfully';
}
function examples(cat,sub){
  const base=codeFor(cat,sub), output=javaOutput(cat,sub);
  const variants=[base,base.replace(/6|7|8/g,'10'),base.replace('System.out.println','System.out.println("Example output:");\n    System.out.println'),javaProgram('  public static void main(String[] args) {\n    System.out.println("Practice: '+sub.replace(/"/g,'\\"')+'");\n  }')];
  return '<h2>Complete Java programs</h2>'+variants.map((program,i)=>'<div class="code-card"><div class="card-head"><span>Example '+(i+1)+' · '+['concept','variation','labelled output','practice'][i]+'</span><span>Java 17</span></div><pre>'+esc(program)+'</pre></div><div class="output"><div class="card-head"><span>Expected output</span><span>result</span></div><pre>'+esc(i===3?'Practice program ready to run.':output)+'</pre></div>').join('');
}
if(location.hash) render(location.hash);
</script>
<script>
function javaDataTypeCode(title, source, output){
  return '<div class="code-card"><div class="card-head"><span>'+esc(title)+'</span><span>Java 17</span></div><pre>'+esc(source)+'</pre></div><div class="output"><div class="card-head"><span>Expected output</span><span>result</span></div><pre>'+esc(output)+'</pre></div>';
}
function javaDataTypesLesson(){
  var byteCode='public class Main {\n  public static void main(String[] args) {\n    byte age = 25;\n    byte temperature = -10;\n    System.out.println("Age: " + age);\n    System.out.println("Temperature: " + temperature);\n  }\n}';
  var shortCode='public class Main {\n  public static void main(String[] args) {\n    short students = 25000;\n    System.out.println("Students: " + students);\n  }\n}';
  var intCode='public class Main {\n  public static void main(String[] args) {\n    int salary = 50000;\n    int bonus = 10000;\n    int total = salary + bonus;\n    System.out.println("Total: " + total);\n  }\n}';
  var longCode='public class Main {\n  public static void main(String[] args) {\n    long distance = 9876543210L;\n    System.out.println(distance);\n  }\n}';
  var floatCode='public class Main {\n  public static void main(String[] args) {\n    float price = 99.50f;\n    System.out.println(price);\n  }\n}';
  var doubleCode='public class Main {\n  public static void main(String[] args) {\n    double price = 1250.75;\n    double tax = 125.25;\n    System.out.println(price + tax);\n  }\n}';
  var charCode='public class Main {\n  public static void main(String[] args) {\n    char grade = \'A\';\n    char digit = \'5\';\n    char symbol = \'@\';\n    System.out.println(grade + " " + digit + " " + symbol);\n  }\n}';
  var booleanCode='public class Main {\n  public static void main(String[] args) {\n    int age = 20;\n    boolean eligible = age >= 18;\n    System.out.println("Eligible: " + eligible);\n  }\n}';
  var castCode='public class Main {\n  public static void main(String[] args) {\n    int whole = 100;\n    double widened = whole;\n    double decimal = 99.99;\n    int narrowed = (int) decimal;\n    System.out.println(widened);\n    System.out.println(narrowed);\n  }\n}';
  var wrapperCode='public class Main {\n  public static void main(String[] args) {\n    int primitive = 100;\n    Integer boxed = primitive;\n    int unboxed = boxed;\n    System.out.println(boxed);\n    System.out.println(unboxed);\n  }\n}';
  var employeeCode='public class Main {\n  public static void main(String[] args) {\n    int employeeId = 101;\n    String employeeName = "Ravi";\n    int age = 28;\n    double salary = 65000.50;\n    char grade = \'A\';\n    boolean active = true;\n    System.out.println("ID: " + employeeId);\n    System.out.println("Name: " + employeeName);\n    System.out.println("Age: " + age);\n    System.out.println("Salary: " + salary);\n    System.out.println("Grade: " + grade);\n    System.out.println("Active: " + active);\n  }\n}';
  var html='<div class="crumb">Java Data Types · Lesson 1</div><h1>Java Data Types</h1><div class="lead"><b>Introduction</b><p>A data type specifies what kind of value a variable can store, which operations are permitted, and how that value is represented. Java is statically typed, so variable types are checked at compile time.</p></div><h2>1. What are Data Types in Java?</h2><p>An employee age is a whole number, salary may contain decimal values, and employment status is either <code>true</code> or <code>false</code>.</p><pre>'+esc('int age = 25;\ndouble salary = 45000.50;\nchar grade = \'A\';\nboolean isEmployee = true;\nString name = "Ravi";')+'</pre><h2>2. Classification of Java Data Types</h2><table><tr><th>Category</th><th>Meaning</th><th>Examples</th></tr><tr><td>Primitive</td><td>Eight built-in value types</td><td>byte, short, int, long, float, double, char, boolean</td></tr><tr><td>Non-Primitive</td><td>Reference types that refer to objects or arrays</td><td>String, arrays, classes, objects, interfaces, enums, records</td></tr></table><h2>3. Primitive Data Types</h2><p>Java provides exactly eight primitive data types.</p><table><tr><th>Type</th><th>Size</th><th>Range or values</th></tr><tr><td><code>byte</code></td><td>1 byte</td><td>-128 to 127</td></tr><tr><td><code>short</code></td><td>2 bytes</td><td>-32,768 to 32,767</td></tr><tr><td><code>int</code></td><td>4 bytes</td><td>-2³¹ to 2³¹−1</td></tr><tr><td><code>long</code></td><td>8 bytes</td><td>-2⁶³ to 2⁶³−1</td></tr><tr><td><code>float</code></td><td>4 bytes</td><td>About 6–7 significant decimal digits</td></tr><tr><td><code>double</code></td><td>8 bytes</td><td>About 15–16 significant decimal digits</td></tr><tr><td><code>char</code></td><td>2 bytes</td><td>UTF-16 code unit</td></tr><tr><td><code>boolean</code></td><td>Implementation-dependent</td><td>true or false</td></tr></table><h3>3.1 byte</h3><p>Use <code>byte</code> for small whole numbers and binary-oriented data.</p>'+javaDataTypeCode('byte example',byteCode,'Age: 25\nTemperature: -10')+'<h3>3.2 short</h3><p><code>short</code> stores values larger than byte but smaller than the full int range.</p>'+javaDataTypeCode('short example',shortCode,'Students: 25000')+'<h3>3.3 int</h3><p><code>int</code> is the most commonly used integer type.</p>'+javaDataTypeCode('int example',intCode,'Total: 60000')+'<h3>3.4 long</h3><p>Use <code>long</code> for very large integer values. The <code>L</code> suffix marks a long literal.</p>'+javaDataTypeCode('long example',longCode,'9876543210')+'<h3>3.5 float</h3><p><code>float</code> stores single-precision values. A decimal literal assigned directly to float needs the <code>f</code> suffix.</p>'+javaDataTypeCode('float example',floatCode,'99.5')+'<h3>3.6 double</h3><p><code>double</code> provides double precision and is the usual choice for ordinary floating-point calculations. Use <code>BigDecimal</code> for exact financial decimal arithmetic.</p>'+javaDataTypeCode('double example',doubleCode,'1376.0')+'<h3>3.7 char</h3><p><code>char</code> stores one UTF-16 code unit. Use single quotes for a char and double quotes for a String.</p>'+javaDataTypeCode('char example',charCode,'A 5 @')+'<h3>3.8 boolean</h3><p><code>boolean</code> represents a logical condition.</p>'+javaDataTypeCode('boolean example',booleanCode,'Eligible: true')+'<h2>4. Non-Primitive Data Types</h2><p>Reference variables point to objects or arrays and may contain <code>null</code>.</p><table><tr><th>Reference type</th><th>Example</th><th>Use</th></tr><tr><td>String</td><td><code>String name = "OWCUS";</code></td><td>Sequence of characters and text methods</td></tr><tr><td>Array</td><td><code>int[] marks = {80, 90, 95};</code></td><td>Fixed-size group of same-type values</td></tr><tr><td>Class and object</td><td><code>Student s = new Student();</code></td><td>State and behavior defined by a class</td></tr><tr><td>Interface, enum, record</td><td>Named reference types</td><td>Contracts, fixed choices, and data carriers</td></tr></table><h2>5. Primitive vs Non-Primitive</h2><table><tr><th>Feature</th><th>Primitive</th><th>Non-Primitive</th></tr><tr><td>Stores</td><td>The value directly</td><td>A reference to an object or array</td></tr><tr><td>Examples</td><td>int, char, boolean</td><td>String, arrays, classes</td></tr><tr><td>Can be null</td><td>No</td><td>Yes</td></tr><tr><td>Methods</td><td>No instance methods</td><td>Objects can expose methods</td></tr><tr><td>Count</td><td>Exactly 8</td><td>Many reference types</td></tr></table><h2>6. Type Casting in Java</h2><p>Casting converts a value from one type to another. Widening usually happens automatically; narrowing requires an explicit cast and may lose information.</p>'+javaDataTypeCode('Widening and narrowing',castCode,'100.0\n99')+'<h2>7. Wrapper Classes</h2><p>Java provides an object wrapper for every primitive: Byte, Short, Integer, Long, Float, Double, Character, and Boolean. Autoboxing converts a primitive to an object; unboxing performs the reverse.</p>'+javaDataTypeCode('Autoboxing and unboxing',wrapperCode,'100\n100')+'<h2>8. Real-World Example: Employee Details</h2><p>This example combines integer, text, decimal, character, and boolean fields in one employee record.</p>'+javaDataTypeCode('Employee details',employeeCode,'ID: 101\nName: Ravi\nAge: 28\nSalary: 65000.5\nGrade: A\nActive: true')+'<h2>9. Common Mistakes</h2><table><tr><th>Mistake</th><th>Correction</th></tr><tr><td><code>int salary = 25000.50;</code></td><td>Use <code>double salary = 25000.50;</code></td></tr><tr><td><code>float price = 99.99;</code></td><td>Use <code>float price = 99.99f;</code></td></tr><tr><td><code>char grade = "A";</code></td><td>Use <code>char grade = \'A\';</code></td></tr><tr><td>Using double for exact money</td><td>Use <code>BigDecimal</code> for exact decimal calculations</td></tr></table><h2>Practice exercises</h2><ol><li>Declare one variable of each primitive type and print its value.</li><li>Convert an int to double and a double to int. Explain the output.</li><li>Create an employee program with a wrapper Integer and a String field.</li></ol><h2>Interview questions</h2><ol><li>What is the difference between primitive and reference types?</li><li>Why is the <code>f</code> suffix required for float literals?</li><li>What happens to the decimal portion during narrowing conversion?</li><li>What are autoboxing and unboxing?</li></ol><div class="summary"><b>Summary:</b> Choose a type that matches the value, use reference types for objects, cast explicitly when narrowing, and avoid floating-point types for exact financial calculations.</div><div class="pager"><a href="#j3-4">« Previous</a><a href="#j4-1">Next »</a></div>';

}

  var frequency=String.raw`import java.util.LinkedHashMap;
import java.util.Map;

public class Main {
  public static void main(String[] args) {
    int[] arr = {10, 20, 10, 30, 20, 10};
    Map<Integer, Integer> counts = new LinkedHashMap<>();

  return '<div class="crumb">Java Arrays · Lesson 1</div><h1>Java Arrays</h1><div class="lead"><b>Introduction</b><p>An array is an object that stores a fixed number of elements of the same declared type. Arrays are useful when a program needs indexed, ordered data such as marks, prices, sensor readings, or matrix values.</p></div><h2>1. What is an Array in Java?</h2><p>Without an array, five marks need five separate variables. With an array, the values can be stored and processed together.</p><pre>'+esc('int mark1 = 80;\nint mark2 = 90;\nint[] marks = {80, 90, 75, 85, 95};')+'</pre><p>Array indexing starts at zero. For <code>int[] numbers = {10, 20, 30, 40, 50}</code>, the first element is <code>numbers[0]</code> and the last is <code>numbers[4]</code>.</p><div class="diagram"><svg viewBox="0 0 900 150" role="img" aria-label="Array index diagram"><text x="30" y="25" font-family="Arial" font-size="16" fill="#0b7a5a">int[] numbers = {10, 20, 30, 40, 50}</text>'+[0,1,2,3,4].map(function(i){return '<rect x="'+(25+i*170)+'" y="50" width="145" height="55" rx="8" fill="#e6f4ee" stroke="#0b7a5a"/><text x="'+(97+i*170)+'" y="75" text-anchor="middle" font-family="Arial" font-size="14">Index '+i+'</text><text x="'+(97+i*170)+'" y="94" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">'+[10,20,30,40,50][i]+'</text>'}).join('')+'</svg><figcaption>Each element is reached through its zero-based index.</figcaption></div><h2>2. Types of Arrays</h2><table><tr><th>Type</th><th>Meaning</th><th>Example</th></tr><tr><td>One-dimensional</td><td>A linear sequence of elements</td><td><code>int[] a = {1, 2, 3};</code></td></tr><tr><td>Multidimensional</td><td>An array containing other arrays</td><td><code>int[][] a = &#123;&#123;1,2&#125;,&#123;3,4&#125;&#125;;</code></td></tr><tr><td>Jagged</td><td>Rows have different lengths</td><td><code>&#123;&#123;10,20&#125;,&#123;30,40,50&#125;&#125;</code></td></tr></table><h2>3. Declaration, creation and initialization</h2><pre>'+esc('int[] a = {10, 20, 30, 40};\nint[] b = new int[5];\nint[] c = new int[3];\nc[0] = 10;\nc[1] = 20;\nc[2] = 30;')+'</pre><p>A newly created <code>int</code> array contains zero values. Other element types receive their Java default value, such as <code>false</code> for boolean and <code>null</code> for references.</p><h2>4. One-dimensional array</h2>'+javaArraysStringsExample('Traverse every element',oneD,'10\n20\n30\n40\n50','numbers.length returns the number of elements. The loop starts at index zero and stops before length.')+'<h2>5. Two-dimensional arrays</h2><p>A two-dimensional array is an array of rows. The outer loop visits rows and the inner loop visits each column in the current row.</p>'+javaArraysStringsExample('Print a matrix',twoD,'1 2 3\n4 5 6\n7 8 9','matrix[1][1] is 5, the center value of this 3 × 3 matrix.')+'<h2>6. Jagged arrays</h2>'+javaArraysStringsExample('Rows with different lengths',jagged,'10 20\n30 40 50\n60','Each row is an independent array, so row lengths do not need to match.')+'<h2>7. Arrays utility methods</h2><table><tr><th>Method or property</th><th>Purpose</th></tr><tr><td><code>array.length</code></td><td>Returns the number of elements</td></tr><tr><td><code>Arrays.sort(array)</code></td><td>Sorts elements</td></tr><tr><td><code>Arrays.toString(array)</code></td><td>Displays a one-dimensional array</td></tr><tr><td><code>Arrays.equals(a, b)</code></td><td>Compares array contents</td></tr><tr><td><code>Arrays.copyOf(a, n)</code></td><td>Copies to a requested length</td></tr><tr><td><code>Arrays.fill(a, value)</code></td><td>Fills every element</td></tr><tr><td><code>Arrays.binarySearch(a, key)</code></td><td>Searches a sorted array</td></tr><tr><td><code>Arrays.deepToString(a)</code></td><td>Displays nested arrays</td></tr></table><h2>8. Programming problems</h2>'+javaArraysStringsExample('Find the largest element',largest,'Largest: 80','Start with the first value, compare each value, and replace the current largest when a greater value is found.')+javaArraysStringsExample('Count duplicate occurrences',frequency,'10 = 3\n20 = 2\n30 = 1','LinkedHashMap preserves insertion order while getOrDefault supplies the current count or zero.')+'<h2>Common mistakes</h2><ul><li>Using an index equal to length causes <code>ArrayIndexOutOfBoundsException</code>.</li><li>Forgetting that the first index is zero.</li><li>Assuming every row in a jagged array has the same length.</li><li>Using <code>array.toString()</code> instead of <code>Arrays.toString(array)</code>.</li><li>Comparing arrays with <code>==</code> when content comparison needs <code>Arrays.equals</code>.</li></ul><h2>Practice exercises</h2><ol><li>Reverse an array without creating a second array.</li><li>Find the second-largest distinct element.</li><li>Calculate row and column totals for a matrix.</li><li>Count the frequency of every number using a map.</li></ol><h2>Interview questions</h2><ol><li>Why does Java array indexing start at zero?</li><li>What is the difference between <code>array.length</code> and <code>String.length()</code>?</li><li>How are multidimensional arrays represented in Java?</li><li>Why should <code>Arrays.equals</code> be used instead of <code>==</code>?</li></ol><div class="summary"><b>Summary:</b> Arrays are fixed-size, zero-indexed objects. Choose one-dimensional, multidimensional, or jagged arrays based on the data shape, and use the Arrays utility class for sorting, copying, searching, and comparison.</div><div class="pager"><a href="#j8-4">« Previous</a><a href="#j9-1">Next »</a></div>';
}

  return '<div class="crumb">Java Strings · Lesson 1</div><h1>Java Strings</h1><div class="lead"><b>Introduction</b><p>A <code>String</code> is an object representing a sequence of characters. Java strings are immutable, so operations that appear to change a string create and return a new string.</p></div><h2>1. What is a String?</h2><p><code>String</code> belongs to <code>java.lang</code>, so it can be used without an import statement. It is used for names, messages, file paths, JSON, commands, logs, and user input.</p><pre>'+esc('String name = "Automation Engineer";')+'</pre><h2>2. String creation and the String Pool</h2><p>A string can be created as a literal or with <code>new</code>. Identical literals usually refer to the same pooled object, while <code>new String</code> explicitly creates another object.</p><pre>'+esc('String a = "Java";\nString b = "Java";\nString c = new String("Java");')+'</pre><div class="diagram"><svg viewBox="0 0 900 145" role="img" aria-label="String pool diagram"><rect x="80" y="25" width="180" height="48" rx="8" fill="#e6f4ee" stroke="#0b7a5a"/><rect x="390" y="50" width="180" height="55" rx="8" fill="#fff8e5" stroke="#f0a202"/><rect x="700" y="25" width="130" height="48" rx="8" fill="#e6f4ee" stroke="#0b7a5a"/><text x="170" y="55" text-anchor="middle" font-family="Arial">s1 = "Java"</text><text x="765" y="55" text-anchor="middle" font-family="Arial">s2 = "Java"</text><text x="480" y="83" text-anchor="middle" font-family="Arial" font-weight="700">String Pool: Java</text><path d="M260 49 L390 72 M700 49 L570 72" stroke="#0b7a5a" stroke-width="2"/></svg><figcaption>String literals may share one pooled object; compare content with equals.</figcaption></div><h2>3. Immutability</h2>'+javaArraysStringsExample('concat returns a new String',immutable,'Java\nJava Programming','The first concat result is discarded. The second result is assigned back to text.')+'<h2>4. Important String methods</h2><table><tr><th>Method</th><th>Description</th></tr><tr><td><code>length()</code></td><td>Number of UTF-16 code units</td></tr><tr><td><code>charAt(index)</code></td><td>Character code unit at an index</td></tr><tr><td><code>substring()</code></td><td>Extracts part of a string</td></tr><tr><td><code>equals()</code></td><td>Compares content</td></tr><tr><td><code>equalsIgnoreCase()</code></td><td>Compares while ignoring case</td></tr><tr><td><code>compareTo()</code></td><td>Lexicographic comparison</td></tr><tr><td><code>toUpperCase()</code> / <code>toLowerCase()</code></td><td>Changes letter case</td></tr><tr><td><code>trim()</code> / <code>strip()</code></td><td>Removes surrounding whitespace</td></tr><tr><td><code>replace()</code></td><td>Replaces matching content</td></tr><tr><td><code>contains()</code></td><td>Checks for a sequence</td></tr><tr><td><code>startsWith()</code> / <code>endsWith()</code></td><td>Checks text boundaries</td></tr><tr><td><code>split()</code></td><td>Splits using a regular expression</td></tr><tr><td><code>indexOf()</code> / <code>lastIndexOf()</code></td><td>Finds occurrences</td></tr><tr><td><code>isEmpty()</code> / <code>isBlank()</code></td><td>Checks empty or whitespace-only text</td></tr></table><h2>5. String comparison: == versus equals()</h2>'+javaArraysStringsExample('Compare references and content',comparison,'true\nfalse\ntrue','== compares object references. equals compares the characters, so equals is the correct choice for content.')+'<h2>6. String versus StringBuilder versus StringBuffer</h2><table><tr><th>Feature</th><th>String</th><th>StringBuilder</th><th>StringBuffer</th></tr><tr><td>Mutable</td><td>No</td><td>Yes</td><td>Yes</td></tr><tr><td>Synchronized methods</td><td>Not applicable</td><td>No</td><td>Yes</td></tr><tr><td>Best use</td><td>Text values</td><td>Repeated changes in one thread</td><td>Shared mutable text requiring synchronization</td></tr><tr><td>Performance</td><td>Creates new strings when modified</td><td>Efficient for repeated changes</td><td>Synchronization adds overhead</td></tr></table><h2>7. Important String programs</h2>'+javaArraysStringsExample('Reverse a String',reverse,'avaJ','StringBuilder reverses the characters and returns a new string.')+javaArraysStringsExample('Check a palindrome',palindrome,'Palindrome','A palindrome reads the same forwards and backwards.')+javaArraysStringsExample('Check anagrams',anagram,'true','Sorting both character arrays makes equal character frequencies comparable.')+javaArraysStringsExample('Count vowels and consonants',vowel,'Vowels: 6\nConsonants: 4','The program counts alphabetic characters and separates vowels from consonants.')+'<h2>Common mistakes</h2><ul><li>Use <code>equals</code> for string content instead of <code>==</code>.</li><li>Remember that String methods return new values; they do not modify the original object.</li><li>Use StringBuilder for repeated concatenation in loops.</li><li>Do not assume every Unicode character fits in one <code>char</code>; supplementary code points need code-point-aware processing.</li><li>Use <code>isBlank</code> when whitespace-only input should count as empty.</li></ul><h2>Practice exercises</h2><ol><li>Reverse only the last word in <code>automation engineer</code>.</li><li>Count the frequency of every character using LinkedHashMap.</li><li>Compare two strings ignoring case and surrounding whitespace.</li><li>Build a sentence with StringBuilder and measure the result.</li></ol><h2>Interview questions</h2><ol><li>Why is String immutable in Java?</li><li>What is the String Pool?</li><li>When should StringBuilder or StringBuffer be used?</li><li>What is the difference between equals and ==?</li><li>How can an anagram be checked efficiently?</li></ol><div class="summary"><b>Summary:</b> String is immutable text, equals compares content, the pool can share literals, and StringBuilder is the practical choice for repeated single-threaded modifications.</div><div class="pager"><a href="#j9-4">« Previous</a><a href="#j11-0">Next »</a></div>';
}
